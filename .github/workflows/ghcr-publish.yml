name: Build & Publish (GHCR)

# Builds the root Dockerfile and publishes it to GitHub Container Registry:
#   ghcr.io/<owner>/openreply:latest and :<commit sha>
# Uses the workflow's own GITHUB_TOKEN, so no extra secrets are needed.
# The same image runs the web app (`npm run start`), the DM worker
# (`npm run worker`) and the cron scheduler (`sh scripts/cron.sh`).
#
# New GHCR packages are private. To pull without registry credentials (for
# example from Railway), make the package public under the repository's
# Packages settings, or give the deploy target a read:packages token.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/openreply

jobs:
  build-and-push:
    name: Build & push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name (lowercase)
        id: image
        run: echo "name=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=openreply
          cache-from: type=gha
          cache-to: type=gha,mode=max
